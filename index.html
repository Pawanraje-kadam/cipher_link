<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + no maximum-scale: edge-to-edge on Android gesture
         bars, and pinch-zoom stays available (WCAG 1.4.4 — never block zoom to
         stop iOS autofit; the fields are sized at >= 1rem instead). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="CipherLink — AES-256-GCM encryption in the browser. No servers. No logs. The key never leaves your machine."
    />
    <!-- Type is self-hosted (public/fonts, latin subset, OFL 1.1): no third-party
         font request, works offline, and can't be killed by a strict CSP or a
         blocked CDN. Preload the two 700 faces the whole UI is set in so the
         metric-matched fallback barely gets a chance to paint. -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>CipherLink // AES-256-GCM in-browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
